name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What evidence, decision, or onboarding problem cannot be solved today?
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: Smallest useful solution and alternatives
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Does this keep the local, no-server v0.1 boundary?
      options: ["Yes", "No", "Unsure"]
    validations:
      required: true
